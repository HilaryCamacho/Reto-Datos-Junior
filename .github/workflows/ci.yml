name: CI

# Verifica en cada Pull Request y en cada cambio a main que el proyecto:
#   1) construye y pasa todas las pruebas desde cero,
#   2) se puede correr dos veces sin duplicar nada (idempotencia),
#   3) tiene pruebas que sí detectan errores (se sabotean a propósito).
# No usa secretos ni servicios externos: DuckDB corre dentro del propio runner.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dbt:
    # Fijado (no "ubuntu-latest"): el proyecto se probó con Python 3.9, y las imágenes
    # más nuevas de Ubuntu ya no traen un Python 3.9 disponible para setup-python.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Instalar dependencias (versiones fijadas)
        run: pip install -r requirements.txt

      - name: dbt build, primera corrida (desde cero)
        run: dbt build

      - name: dbt build, segunda corrida (idempotencia)
        run: dbt build

      - name: Verificar idempotencia (hash del contenido de las 15 tablas)
        run: python tools/verificar_idempotencia.py

      - name: Prueba de las pruebas (14 errores introducidos a propósito)
        run: python tools/probar_pruebas.py

      - name: Prueba de humo del perfilador (debe seguir detectando lo conocido)
        run: |
          python tools/perfilar_tabla.py data/replica/carga_1/fle_viaje.csv --llave IdViaje \
            --orden "FechaRealEmbarque<=FechaEmbarqueFinal" > perfil_viaje.md
          grep -q "centinela de fecha" perfil_viaje.md
          grep -q "copias exactas" perfil_viaje.md
          python tools/perfilar_tabla.py data/replica/carga_1/fle_viaje_det.csv --llave IdViaje,IdPartida \
            --rel ClaCliente=data/replica/carga_1/vta_cliente.csv:ClaCliente > perfil_det.md
          grep -q "no existen en la tabla de referencia" perfil_det.md
